roke-width="3" marker-end="url(#arrow)"/><text x="48" y="740" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#253c32" font-weight="bold">Preparation changes picture and audio.</text><text x="48" y="780" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#253c32">Exact edit gates compare against the prepared clip.</text><text x="48" y="820" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#253c32">The original upload remains downloadable byte-for-byte.</text><text x="48" y="875" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#253c32">One serial media pipeline · eight jobs · 24-hour expiry · no application AWS API permissions</text><text x="48" y="912" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#253c32">Substantive OpenCV analysis and FFmpeg preparation/export execute on ECS, with human review before editing.</text></svg>